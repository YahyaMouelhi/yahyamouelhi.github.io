# =============================================================
#  _config.yml — 4N7H4R4X · Jekyll Chirpy
# =============================================================

# Import the theme
theme: jekyll-theme-chirpy

# ── Identity ──────────────────────────────────────────────────
title:       "4N7H4R4X"
tagline:     "// ctf writeups · offensive security · red team notes"
description: >-
  CTF writeups covering Binary Exploitation and other topics .

url:     "https://yahyamouelhi.github.io"
baseurl: ""

# ── Language & Timezone ───────────────────────────────────────
lang:     en
timezone: Africa/Tunis

# ── Author ────────────────────────────────────────────────────
github:
  username: yahyamouelhi

social:
  name:  4n7h4r4x
  email: yahya.mouelhi@edu.isetcom.tn
  links:
    - https://github.com/yahyamouelhi
    - https://www.facebook.com/yahyamoelhi
    - https://www.linkedin.com/in/yahyamouelhi

# ── Theme ─────────────────────────────────────────────────────
# theme_mode: dark   # commented out so the light/dark toggle works

# ── Avatar ────────────────────────────────────────────────────
# Drop your animated GIF at assets/images/avatar.gif
avatar: /assets/images/avatar.png

social_preview_image: # string, local or CORS resources

# ── Posts & display ───────────────────────────────────────────
paginate:     10
toc:          true
reading_time: true

# ── Site Verification ─────────────────────────────────────────
webmaster_verifications:
  google:
  bing:
  alexa:
  yandex:
  baidu:
  facebook:

# ── Analytics ─────────────────────────────────────────────────
analytics:
  google:
    id:
  goatcounter:
    id:
  umami:
    id:
    domain:
  matomo:
    id:
    domain:
  cloudflare:
    id:
  fathom:
    id:

# ── Page views ────────────────────────────────────────────────
pageviews:
  provider:

# ── CDN ───────────────────────────────────────────────────────
cdn:

# ── Comments (optional) ──────────────────────────────────────
comments:
  provider:
  disqus:
    shortname:
  utterances:
    repo:
    issue_term:
  giscus:
    repo:
    repo_id:
    category:
    category_id:
    mapping:
    strict:
    input_position:
    lang:
    reactions_enabled:

# ── Self-hosted static assets ────────────────────────────────
assets:
  self_host:
    enabled:
    env:

# ── PWA ───────────────────────────────────────────────────────
pwa:
  enabled: true
  cache:
    enabled: true
    deny_paths:

# ------------ The following options are not recommended to be modified ------------------

kramdown:
  footnote_backlink: "&#8617;&#xfe0e;"
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: highlight
    span:
      line_numbers: false
    block:
      line_numbers: true
      start_line: 1

collections:
  tabs:
    output: true
    sort_by: order

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      comments: true
      toc: true
      permalink: /posts/:title/
  - scope:
      path: _drafts
    values:
      comments: false
  - scope:
      path: ""
      type: tabs
    values:
      layout: page
      permalink: /:title/

sass:
  style: compressed

compress_html:
  clippings: all
  comments: all
  endings: all
  profile: false
  blanklines: false
  ignore:
    envs: [development]

exclude:
  - "*.gem"
  - "*.gemspec"
  - docs
  - tools
  - README.md
  - LICENSE
  - purgecss.js
  - "*.config.js"
  - "package*.json"

jekyll-archives:
  enabled: [categories, tags]
  layouts:
    category: category
    tag: tag
  permalinks:
    tag: /tags/:name/
    category: /categories/:name/

plugins:
  # - jekyll-feed     # disabled — we don't use RSS; avoids feed.xml conflict
  - jekyll-sitemap
  - jekyll-seo-tag
  - jekyll-archives
